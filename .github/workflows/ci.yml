name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

# Read-only by default: CI builds and tests, it never writes to the repo.
permissions:
    contents: read

jobs:
    lint:
        name: Lint, format & typecheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: npm
            # No native build needed for lint/format/typecheck
            - run: npm ci --ignore-scripts
            - run: npm run lint
            - run: npm run format:check
            - run: npm run typecheck
            - name: Build the web SPA
              run: npm run build

    test:
        name: Test (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        services:
            # The portal's share/payment persistence is tested against a real
            # Redis; those tests skip themselves when none is reachable.
            redis:
                image: redis:7
                ports:
                    - 6399:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        strategy:
            fail-fast: false
            matrix:
                # Buildless TypeScript needs Node 22.18+ (native type
                # stripping). 22 and 24 are the maintenance/active LTS lines,
                # 26 the current one. The native addon builds with the
                # runner's default toolchain: since the strict-aliasing and
                # overflow fixes in native/, the known-answer vectors pass on
                # GCC 12, 13 and 14 alike, so no compiler pin is needed.
                node-version: [22.x, 24.x, 26.x]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
            - run: npm ci
            - name: Check config files parse
              run: npm run check:config
            - name: Run the workspace test suites
              run: npm test
