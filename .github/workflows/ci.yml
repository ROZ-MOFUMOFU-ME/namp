name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint:
        name: Lint, format & typecheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: npm
            # No native build needed for lint/format/typecheck
            - run: npm ci --ignore-scripts
            - run: npm run lint
            - run: npm run format:check
            - run: npm run typecheck

    test:
        name: Test (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # Buildless TypeScript runs via Node's native type stripping /
                # tsx, which requires Node 22.18+; the native addon compiles
                # with -std=c++20 on the runner's default toolchain.
                node-version: [22.x, 24.x]
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
            - name: Use GCC 12 for the native build
              # Newer GCC (13+) miscompiles some vendored C — neoscrypt's
              # known-answer vectors fail. GCC 12 matches the verified
              # toolchain (the old CircleCI setup pinned GCC 10 for the
              # same reason).
              run: |
                  sudo apt-get update
                  sudo apt-get install -y gcc-12 g++-12
                  echo "CC=gcc-12" >> "$GITHUB_ENV"
                  echo "CXX=g++-12" >> "$GITHUB_ENV"
            - run: npm ci
            - name: Check config files parse
              run: npm run check:config --workspace namp-portal
            - name: Run the workspace test suites
              run: npm test
