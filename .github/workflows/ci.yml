name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint:
        name: Lint, format & typecheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check
            - run: npm run typecheck

    test:
        name: Test (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # Buildless TypeScript runs via Node's native type stripping /
                # tsx, which requires Node 22.18+; the native addon compiles
                # with -std=c++20 on the runner's default toolchain.
                node-version: [22.x, 24.x]
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
            - run: npm ci
            - name: Check config files parse
              run: npm run check:config --workspace zny-nomp
            - name: Run the workspace test suites
              run: npm test
