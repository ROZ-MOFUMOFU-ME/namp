name: Release

# One vX.Y.Z tag releases the whole stack (replaces the old three-repo
# "tag downstream, pin upstream" dance). Cut tags from a CI-green commit
# on main; the CI workflow does not run on tag pushes.
on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write # required to create the release

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '24.x'

            - name: Verify the tag matches package.json version
              run: |
                  tag="${GITHUB_REF_NAME#v}"
                  pkg="$(node -p "require('./package.json').version")"
                  if [ "$tag" != "$pkg" ]; then
                      echo "::error::Tag ${GITHUB_REF_NAME} (${tag}) does not match package.json version (${pkg})"
                      exit 1
                  fi
                  echo "Tag matches package.json version: ${pkg}"

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  prerelease_flag=""
                  case "${GITHUB_REF_NAME}" in
                      *-*) prerelease_flag="--prerelease" ;;
                  esac
                  gh release create "${GITHUB_REF_NAME}" \
                      --title "NAMP ${GITHUB_REF_NAME}" \
                      --generate-notes \
                      $prerelease_flag
